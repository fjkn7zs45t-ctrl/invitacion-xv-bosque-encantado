<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Encabezado -->
        <div class="header">
            <h1><i class="fas fa-tasks"></i> Mi Lista de Tareas</h1>
            <p class="subtitle">Organiza tu día, alcanza tus metas</p>
        </div>

        <!-- Sección de entrada -->
        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Agrega una nueva tarea..."
                    autocomplete="off"
                >
                <button id="addBtn" class="btn-add">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-list"></i> Todas
                </button>
                <button class="filter-btn" data-filter="active">
                    <i class="fas fa-circle-notch"></i> Activas
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-circle"></i> Completadas
                </button>
            </div>
        </div>

        <!-- Sección de tareas -->
        <div class="tasks-section">
            <ul id="taskList" class="task-list">
                <!-- Las tareas se agregan aquí dinámicamente -->
            </ul>
            
            <!-- Mensaje vacío -->
            <div id="emptyMessage" class="empty-message">
                <i class="fas fa-inbox"></i>
                <p>No hay tareas. ¡Crea una para comenzar!</p>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total:</span>
                <span id="totalCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Completadas:</span>
                <span id="completedCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Pendientes:</span>
                <span id="pendingCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Progreso:</span>
                <span id="progressPercent" class="stat-value">0%</span>
            </div>
        </div>

        <!-- Barra de progreso -->
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <!-- Acciones -->
        <div class="actions">
            <button id="clearCompletedBtn" class="btn-action btn-clear">
                <i class="fas fa-trash"></i> Limpiar Completadas
            </button>
            <button id="exportBtn" class="btn-action btn-export">
                <i class="fas fa-download"></i> Exportar
            </button>
            <button id="clearAllBtn" class="btn-action btn-danger">
                <i class="fas fa-ban"></i> Borrar Todo
            </button>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3>Confirmar acción</h3>
            <p id="confirmMessage">¿Estás seguro?</p>
            <div class="modal-buttons">
                <button id="cancelBtn" class="btn-cancel">Cancelar</button>
                <button id="confirmBtn" class="btn-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
